# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "389612ec9ce10dda7e0932295e23a445"
name = "Trello-App"
application_url = "https://admin.shopify.com/store/seodrome-studio/apps/trello-app-1"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[webhooks.privacy_compliance]
customer_data_request = "/webhooks"
customer_redaction = "/webhooks"
shop_redaction = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://admin.shopify.com/store/seodrome-studio/apps/trello-app-1/api/auth",
  "https://floors-youth-sql-bolt.trycloudflare.com/auth/callback",
  "http://localhost:3000/auth/callback"
]
